[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sinclair"
version = "0.1.0"
description = "A pragmatic agent runtime with first-class survey analysis primitives."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Vinicius Parreira", email = "figueiredo@protonmail.com" }]
requires-python = ">=3.11"
keywords = ["llm", "agent", "langgraph", "structured-output", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[project.urls]
Homepage = "https://github.com/jovemexausto/sinclair"
Repository = "https://github.com/jovemexausto/sinclair"

[tool.pytest.ini_options]
testpaths = ["tests", "sinclair/survey/tests"]
markers = ["integration: requires real LLM API keys"]

[tool.hatch.build.targets.wheel]
packages = ["sinclair"]

[dependency-groups]
dev = [
    "pandas>=2.2",
    "pytest>=9.0",
]
